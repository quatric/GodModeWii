name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitppc:latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install dolxz build dependencies
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends gcc libc6-dev liblzma-dev pkg-config curl ca-certificates

      - name: Build controller libraries
        run: |
          apt-get update -qq && apt-get install -y -qq python3 git ca-certificates >/dev/null
          ./scripts/build_controller_portlibs.sh

      - name: Build
        run: make WITH_WIIDRC=1 WITH_WUPC=1 WITH_SICKSAXIS=1

      - name: Package for the Homebrew Channel
        run: |
          mkdir -p dist/apps/GodModeWii
          cp GodModeWii-xz.dol dist/apps/GodModeWii/boot.dol
          cp apps/GodModeWii/meta.xml apps/GodModeWii/icon.png dist/apps/GodModeWii/
          cp README.md LICENSE dist/apps/GodModeWii/
          (cd dist && apt-get update -qq && apt-get install -y -qq zip >/dev/null && zip -qr ../GodModeWii.zip apps)

      - uses: actions/upload-artifact@v4
        with:
          name: GodModeWii
          path: GodModeWii.zip
          if-no-files-found: error

  # Every push to the default branch refreshes the "latest" release; tags like v1.2.0 also get their own release.
  release:
    needs: build
    if: github.event_name == 'push' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: GodModeWii
          path: out
      - name: Move the latest tag
        if: startsWith(github.ref, 'refs/heads/')
        run: |
          git tag -f latest
          git push -f origin latest
      - name: Publish latest release
        if: startsWith(github.ref, 'refs/heads/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: GodModeWii (latest)
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          body: |
            Latest build of GodModeWii from ${{ github.sha }}.

            Extract GodModeWii.zip to the root of your SD card (or USB drive) and open GodModeWii from the Homebrew Channel. **Modifying the NAND can brick your console** - read the README first.
          files: |
            out/GodModeWii.zip
      - name: Publish tagged release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: GodModeWii ${{ github.ref_name }}
          make_latest: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            Extract GodModeWii.zip to the root of your SD card (or USB drive) and open GodModeWii from the Homebrew Channel. **Modifying the NAND can brick your console** - read the README first.
          files: |
            out/GodModeWii.zip
