name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitppc:latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install dolxz build dependencies
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends gcc libc6-dev liblzma-dev pkg-config curl ca-certificates

      - name: Build controller libraries
        run: |
          apt-get update -qq && apt-get install -y -qq python3 git ca-certificates >/dev/null
          ./scripts/build_controller_portlibs.sh

      - name: Build
        run: make WITH_WIIDRC=1 WITH_WUPC=1 WITH_SICKSAXIS=1

      - name: Package for the Homebrew Channel
        run: |
          mkdir -p dist/apps/GodModeWii
          cp GodModeWii-xz.dol dist/apps/GodModeWii/boot.dol
          cp apps/GodModeWii/meta.xml apps/GodModeWii/icon.png dist/apps/GodModeWii/
          cp README.md LICENSE dist/apps/GodModeWii/
          (cd dist && apt-get update -qq && apt-get install -y -qq zip >/dev/null && zip -qr ../GodModeWii.zip apps)

      - uses: actions/upload-artifact@v4
        with:
          name: GodModeWii
          path: GodModeWii.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: GodModeWii
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" GodModeWii.zip \
            --repo "${{ github.repository }}" \
            --title "GodModeWii ${{ github.ref_name }}" \
            --notes "Extract the zip to the root of your SD card and run GodModeWii from the Homebrew Channel. **Modifying the NAND can brick your console** - read the README first."
